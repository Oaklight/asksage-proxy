[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "asksage-proxy"
version = "1.0.0"
authors = [{ name = "Peng Ding", email = "oaklight@gmx.com" }]
description = "Launcher for the llm-rosetta gateway with the AskSage shims"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
classifiers = [
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

# The proxy is llm-rosetta-gateway; the conversion is llm-rosetta.  Neither is
# pulled in here by name of a provider SDK: llm-rosetta has no runtime
# dependencies, and the gateway vendors its HTTP stack.
#
# The AskSage shims are NOT a dependency: they are not published on PyPI.  The
# launcher either finds the installed package, a warm preset cache, or a
# reachable codeload tarball, and tells the operator how to fix it otherwise.
dependencies = [
    "llm-rosetta>=0.14",
    "llm-rosetta-gateway>=0.14",
    "PyYAML>=6.0.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "build>=1.2.2.post1",
    "twine>=6.1.0",
]

[project.urls]
Documentation = "https://github.com/Oaklight/asksage-proxy#readme"
Repository = "https://github.com/Oaklight/asksage-proxy"
Issues = "https://github.com/Oaklight/asksage-proxy/issues"

[project.scripts]
asksage-proxy = "asksage_proxy.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"asksage_proxy" = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
